<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard - Lucky Jackpot</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="navbar"><div class="container"><div class="logo">💎 Lucky Jackpot</div><nav class="nav-links"><a href="index.html">Games</a><a href="features.html">Features</a><a href="updates.html">Updates</a><a href="user.html">User</a><a href="leaderboard.html" aria-current="page">Leaderboard</a><a href="faq.html">FAQ</a><a href="contact.html">Contact</a></nav><div class="auth-buttons"><div class="token-wallet">Tokens <strong id="token-count">1,000</strong></div><button class="btn-login">Login</button><button class="btn-signup">Sign Up</button><button class="btn-admin" type="button">Admin</button><button class="theme-toggle" id="theme-toggle" type="button" aria-pressed="true">Light mode</button></div></div></header>
    <main><section class="user-section"><div class="container user-profile"><span class="section-kicker">Community rankings</span><div class="updates-heading"><div><span class="section-kicker">Top ten</span><h1>Leaderboard</h1></div><p>Players with the most play-money tokens.</p></div><div id="leaderboard-list" class="leaderboard-list"><p class="user-history-note">Loading leaderboard…</p></div><a class="btn-primary" href="index.html#games">Play a game</a></div></section></main>

    <script>
        window.__leaderboardLocalBalance = null;
        try {
            const currentAccount = JSON.parse(localStorage.getItem('lucky-jackpot-current-account') || 'null');
            const savedAccounts = JSON.parse(localStorage.getItem('lucky-jackpot-accounts') || '[]');
            const localAccount = Array.isArray(savedAccounts)
                ? savedAccounts.find(account => account.email === currentAccount?.email)
                : null;
            const localTokens = Number(localAccount?.tokens);
            if (currentAccount?.email && Number.isFinite(localTokens)) {
                window.__leaderboardLocalBalance = { email: currentAccount.email, tokens: Math.max(0, Math.round(localTokens)) };
            }
        } catch (error) {}
    </script>
    <script src="script.js"></script>
    <script src="events.js"></script>
    <script>
        let leaderboardRequestInFlight = false;
        let lastLeaderboardSignature = '';

        function renderLiveLeaderboard(players) {
            const list = document.querySelector('#leaderboard-list');
            if (!list) return;

            const signature = JSON.stringify(players);
            if (signature === lastLeaderboardSignature) return;
            lastLeaderboardSignature = signature;

            list.innerHTML = players.length ? players.map((player, index) => `
                <article class="leaderboard-row ${index < 3 ? 'is-top' : ''}">
                    <strong class="leaderboard-rank">${index + 1}</strong>
                    <span class="leaderboard-name">${escapeHtml(player.name || 'Player')}</span>
                    <strong class="leaderboard-tokens">${Number(player.tokens || 0).toLocaleString()} tokens</strong>
                </article>`).join('') : '<p class="user-history-empty">No players yet. Create an account to claim the top spot.</p>';
        }

        async function reconcileCurrentPlayerBalance() {
            const localBalance = window.__leaderboardLocalBalance;
            if (!localBalance?.email || !Number.isFinite(localBalance.tokens)) return;

            try {
                const accountResponse = await fetch('/api/auth/me', { cache: 'no-store' });
                if (!accountResponse.ok) return;
                const serverAccount = await accountResponse.json();
                const serverTokens = Number(serverAccount.tokens);
                if (!Number.isFinite(serverTokens) || localBalance.tokens <= serverTokens) return;

                const response = await fetch('/api/accounts', {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: localBalance.email, tokens: localBalance.tokens }),
                    keepalive: true,
                    cache: 'no-store'
                });
                if (!response.ok) return;

                try {
                    const savedAccounts = JSON.parse(localStorage.getItem('lucky-jackpot-accounts') || '[]');
                    if (Array.isArray(savedAccounts)) {
                        const account = savedAccounts.find(item => item.email === localBalance.email);
                        if (account) {
                            account.tokens = localBalance.tokens;
                            localStorage.setItem('lucky-jackpot-accounts', JSON.stringify(savedAccounts));
                        }
                    }
                } catch (error) {}
            } catch (error) {}
        }

        async function loadLeaderboard() {
            if (leaderboardRequestInFlight) return;
            const list = document.querySelector('#leaderboard-list');
            if (!list) return;

            leaderboardRequestInFlight = true;
            try {
                await reconcileCurrentPlayerBalance();
                const response = await fetch('/api/leaderboard', { cache: 'no-store' });
                if (!response.ok) throw new Error('Unavailable');
                const players = await response.json();
                renderLiveLeaderboard(Array.isArray(players) ? players : []);
            } catch (error) {
                if (!lastLeaderboardSignature) {
                    list.innerHTML = '<p class="user-history-note">The leaderboard is temporarily unavailable.</p>';
                }
            } finally {
                leaderboardRequestInFlight = false;
            }
        }

        loadLeaderboard();
        window.setInterval(() => {
            if (!document.hidden) loadLeaderboard();
        }, 1000);

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) loadLeaderboard();
        });
    </script>
</body>
</html>
